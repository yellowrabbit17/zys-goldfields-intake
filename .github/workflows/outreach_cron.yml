name: Daily Conservation Grant Outreach & Follow-Up Cron

on:
  schedule:
    # Runs daily at 16:00 UTC (8:00 AM PST / 9:00 AM PDT — California business morning)
    - cron: "0 16 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run only (preview planned sends without dispatching real emails)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      max_sends:
        description: "Optional max emails override for this run (leave empty to use DAILY_SEND_LIMIT)"
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  run-outreach-batch:
    name: Trigger Warm-Up & Day 4/9 Follow-Up Batch
    runs-on: ubuntu-latest
    env:
      # Set GitHub Variable PORTAL_BASE_URL=https://portal.zysgoldfields.pro after pointing Porkbun CNAME DNS.
      PORTAL_BASE_URL: ${{ vars.PORTAL_BASE_URL || secrets.PORTAL_BASE_URL || 'https://zys-goldfields-intake.onrender.com' }}
      ADMIN_API_TOKEN: ${{ secrets.ADMIN_API_TOKEN }}
      DRY_RUN_INPUT: ${{ inputs.dry_run || 'false' }}
      MAX_SENDS_INPUT: ${{ inputs.max_sends || '' }}

    steps:
      - name: Validate required secrets
        run: |
          if [ -z "${ADMIN_API_TOKEN}" ]; then
            echo "ERROR: Repository secret ADMIN_API_TOKEN is not set."
            echo "Add ADMIN_API_TOKEN under GitHub Repo -> Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          echo "Target Portal URL: ${PORTAL_BASE_URL}"

      - name: Wake Render instance via /healthz
        run: |
          TARGET="${PORTAL_BASE_URL%/}"
          for attempt in 1 2 3 4 5 6; do
            code=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 30 "${TARGET}/healthz" || echo "000")
            echo "Attempt ${attempt}: GET ${TARGET}/healthz -> HTTP ${code}"
            if [ "${code}" = "200" ]; then
              exit 0
            fi
            sleep 10
          done
          echo "ERROR: Portal /healthz did not return HTTP 200 after cold-start retries."
          exit 1

      - name: Execute /api/cron/run-outreach
        run: |
          TARGET="${PORTAL_BASE_URL%/}"
          BODY=$(python3 - <<'PY'
          import json, os
          payload = {"dry_run": os.environ.get("DRY_RUN_INPUT", "false").lower() == "true"}
          ms = os.environ.get("MAX_SENDS_INPUT", "").strip()
          if ms:
              payload["max_sends"] = int(ms)
          print(json.dumps(payload))
          PY
          )
          RESP_FILE=$(mktemp)
          HTTP_CODE=$(curl -sS -w "%{http_code}" -o "${RESP_FILE}" \
            --max-time 60 \
            -X POST "${TARGET}/api/cron/run-outreach" \
            -H "Authorization: Bearer ${ADMIN_API_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "${BODY}")
          echo "Outreach Cron HTTP Status: ${HTTP_CODE}"
          cat "${RESP_FILE}"
          echo ""
          if [ "${HTTP_CODE}" != "200" ]; then
            echo "ERROR: /api/cron/run-outreach failed with HTTP ${HTTP_CODE}"
            exit 1
          fi
